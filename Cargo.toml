[package]
name = "turtles_py"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "turtles"
path = "rust/python/lib.rs"
crate-type = ["cdylib"]

[dependencies]
turtles = { path = "./rust", version = "*" }
pyo3 = { version = "0.29.2", features = ["abi3", "extension-module", "multiple-pymethods"] }

[profile.release]
# NOTE: do NOT set `panic = 'abort'` here. This crate is a Python extension
# module; aborting on panic would kill the host interpreter instead of letting
# PyO3 convert the panic into a Python exception.
lto = true
